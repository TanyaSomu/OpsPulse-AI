name: OpsPulse AI CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Tests & Database Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: opspulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/opspulse
        run: |
          cd backend
          alembic upgrade head

      - name: Seed test database
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/opspulse
        run: |
          cd backend
          python -m app.db.seed

      - name: Run pytest test suite
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/opspulse
        run: |
          cd backend
          pytest app/tests -v

  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run linter
        run: |
          cd frontend
          npm run lint

      - name: Run production build
        run: |
            cd frontend
            npm run build

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: opspulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies & prepare DB
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/opspulse
        run: |
          cd backend
          python -m pip install -r requirements.txt
          alembic upgrade head
          python -m app.db.seed

      - name: Start FastAPI backend in background
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/opspulse
        run: |
          cd backend
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          sleep 3

      - name: Install frontend dependencies & Playwright Chromium
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium

      - name: Start Vite dev server in background
        run: |
          cd frontend
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > vite.log 2>&1 &
          sleep 3

      - name: Run Playwright E2E tests
        run: |
          cd frontend
          npx playwright test
